<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="dg-network-model-title dg-network-model-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-network-model-title">The model at a glance</title>
  <desc id="dg-network-model-desc">A member has a VSU role, joins places, holds a role in a place, and helps with topics they choose. A place is tied to something real at VSU, is looked after by stewards for a term, and has boards. A board holds posts, each labelled by type and dated by state, and a post may hand off to a VSU system.</desc>
  <defs>
    <marker id="dg-network-model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrow" d="M0,0 L10,5 L0,10 z" fill="#8B9083"/>
    </marker>
  </defs>

  <!-- Edges from the member -->
  <g class="dg-edge" fill="none" stroke="#8B9083" stroke-width="1.4">
    <path d="M140,44 H298" marker-end="url(#dg-network-model-arrow)"/>
    <path d="M80,68 V507"/>
    <path d="M80,134 H158" marker-end="url(#dg-network-model-arrow)"/>
    <path d="M80,409 H158" marker-end="url(#dg-network-model-arrow)"/>
    <path d="M80,507 H158" marker-end="url(#dg-network-model-arrow)"/>
    <!-- Edges from the place -->
    <path d="M280,134 H340 V303"/>
    <path d="M340,143 H438" marker-end="url(#dg-network-model-arrow)"/>
    <path d="M340,234 H438" marker-end="url(#dg-network-model-arrow)"/>
    <path d="M340,303 H438" marker-end="url(#dg-network-model-arrow)"/>
    <!-- Board to post to a VSU system -->
    <path d="M565,338 V360" marker-end="url(#dg-network-model-arrow)"/>
    <path d="M565,478 V500" marker-end="url(#dg-network-model-arrow)"/>
  </g>

  <g class="dg-label" font-size="11.5" font-style="italic" fill="#52594C">
    <text x="196" y="38">is</text>
    <text x="88" y="128">joins</text>
    <text x="88" y="403">holds</text>
    <text x="88" y="501">helps with</text>
    <text x="346" y="137">tied to</text>
    <text x="346" y="228">looked after by</text>
    <text x="346" y="297">has</text>
    <text x="573" y="354">holds</text>
    <text x="573" y="494">may hand off to</text>
  </g>

  <!-- Nodes -->
  <g class="dg-node dg-key" fill="#D5E6D3" stroke="#17643A" stroke-width="1.4">
    <rect x="20" y="20" width="120" height="48" rx="6"/>
    <rect x="160" y="110" width="120" height="48" rx="6"/>
  </g>
  <circle class="dg-pin" cx="266" cy="124" r="5" fill="#E2AE1C"/>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="300" y="16" width="380" height="56" rx="6"/>
    <rect x="440" y="86" width="250" height="114" rx="6"/>
    <rect x="440" y="214" width="250" height="40" rx="6"/>
    <rect x="440" y="268" width="250" height="70" rx="6"/>
    <rect x="440" y="362" width="250" height="116" rx="6"/>
    <rect x="440" y="502" width="250" height="40" rx="6"/>
    <rect x="160" y="372" width="250" height="74" rx="6"/>
    <rect x="160" y="470" width="250" height="74" rx="6"/>
  </g>

  <g class="dg-title" font-size="14" font-weight="600" fill="#1F2A22">
    <text x="80" y="49" text-anchor="middle">Member</text>
    <text x="211" y="139" text-anchor="middle">Place</text>
    <text x="316" y="39">VSU role</text>
    <text x="456" y="109">Something real at VSU</text>
    <text x="456" y="239">Stewards, for a term</text>
    <text x="456" y="291">Board</text>
    <text x="456" y="385">Post</text>
    <text x="456" y="527">A VSU system</text>
    <text x="176" y="395">Place role</text>
    <text x="176" y="493">Topic</text>
  </g>

  <g class="dg-sub" font-size="11.5" fill="#52594C">
    <text x="316" y="58">student · faculty · staff · alumni, later</text>
    <text x="456" y="128">an office, department, council,</text>
    <text x="456" y="143">organization, service, subject,</text>
    <text x="456" y="158">residence, building, large event,</text>
    <text x="456" y="173">or an interest members start;</text>
    <text x="456" y="188">may name where it is</text>
    <text x="456" y="309">notices · questions · guides ·</text>
    <text x="456" y="324">events · discussion</text>
    <text x="456" y="404">labelled: official · community</text>
    <text x="456" y="419">knowledge · opinion · unverified ·</text>
    <text x="456" y="434">scholarly · external</text>
    <text x="456" y="453">dated: current · updated ·</text>
    <text x="456" y="468">superseded · archived</text>
    <text x="176" y="414">steward · moderator · peer guide ·</text>
    <text x="176" y="430">member, in one place only</text>
    <text x="176" y="512">chosen by the member;</text>
    <text x="176" y="528">questions are routed by it</text>
  </g>
</svg>
