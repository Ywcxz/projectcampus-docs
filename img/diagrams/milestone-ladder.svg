<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="dg-milestone-ladder-title dg-milestone-ladder-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-milestone-ladder-title">The milestone ladder</title>
  <desc id="dg-milestone-ladder-desc">Seven stages climbed in order: recognition, interest, alignment, permission to prototype, pilot, collaboration, and adoption. Tracked apart from the ladder, and never a stage of it: research permission, ethics clearance, and access to VSU's data or systems, each asked for in writing.</desc>
  <defs>
    <marker id="dg-milestone-ladder-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrow" d="M0,0 L10,5 L0,10 z" fill="#8B9083"/>
    </marker>
  </defs>
  <g class="dg-edge" fill="none" stroke="#8B9083" stroke-width="1.4">
    <path d="M250,380 V362" marker-end="url(#dg-milestone-ladder-arrow)"/>
    <path d="M310,320 V302" marker-end="url(#dg-milestone-ladder-arrow)"/>
    <path d="M370,260 V242" marker-end="url(#dg-milestone-ladder-arrow)"/>
    <path d="M430,200 V182" marker-end="url(#dg-milestone-ladder-arrow)"/>
    <path d="M490,140 V122" marker-end="url(#dg-milestone-ladder-arrow)"/>
    <path d="M550,80 V62" marker-end="url(#dg-milestone-ladder-arrow)"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="380" width="260" height="40" rx="6"/>
    <rect x="80" y="320" width="260" height="40" rx="6"/>
    <rect x="140" y="260" width="260" height="40" rx="6"/>
    <rect x="200" y="200" width="260" height="40" rx="6"/>
    <rect x="260" y="140" width="260" height="40" rx="6"/>
    <rect x="320" y="80" width="260" height="40" rx="6"/>
    <rect x="380" y="20" width="260" height="40" rx="6"/>
  </g>
  <g class="dg-node dg-tint" fill="#E2E2D3" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="20" width="280" height="85" rx="6" stroke-dasharray="5 4"/>
  </g>
  <g class="dg-title" font-size="14" font-weight="600" fill="#1F2A22">
    <text x="36" y="405">Recognition</text>
    <text x="96" y="345">Interest</text>
    <text x="156" y="285">Alignment</text>
    <text x="216" y="225">Permission to prototype</text>
    <text x="276" y="165">Pilot</text>
    <text x="336" y="105">Collaboration</text>
    <text x="396" y="45">Adoption</text>
    <text x="36" y="45">Tracked apart, never a stage</text>
  </g>
  <g class="dg-sub" font-size="11.5" fill="#52594C">
    <text x="36" y="60">research permission · ethics clearance</text>
    <text x="36" y="75">access to VSU's data or systems</text>
    <text x="36" y="90">each asked for in writing</text>
  </g>
</svg>
