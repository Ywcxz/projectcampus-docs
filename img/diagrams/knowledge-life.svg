<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 242" role="img" aria-labelledby="dg-knowledge-life-title dg-knowledge-life-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-knowledge-life-title">What stays and what fades</title>
  <desc id="dg-knowledge-life-desc">A post is either knowledge or conversation. Knowledge, such as confirmed answers, guides, official notices, and event records, is kept as the network's memory with its state shown: current, updated, superseded, or archived. Conversation, such as discussion, unconfirmed answers, and comments, is archived after a set period, then deleted.</desc>
  <defs>
    <marker id="dg-knowledge-life-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrow" d="M0,0 L10,5 L0,10 z" fill="#8B9083"/>
    </marker>
  </defs>
  <g class="dg-edge" fill="none" stroke="#8B9083" stroke-width="1.4">
    <path d="M140,126 H170"/>
    <path d="M170,76 V187"/>
    <path d="M170,76 H198" marker-end="url(#dg-knowledge-life-arrow)"/>
    <path d="M170,187 H198" marker-end="url(#dg-knowledge-life-arrow)"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="106" width="120" height="40" rx="6"/>
  </g>
  <g class="dg-node dg-key" fill="#D5E6D3" stroke="#17643A" stroke-width="1.4">
    <rect x="200" y="20" width="480" height="112" rx="6"/>
  </g>
  <g class="dg-node dg-tint" fill="#E2E2D3" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="216" y="90" width="100" height="26" rx="6"/>
    <rect x="326" y="90" width="100" height="26" rx="6"/>
    <rect x="436" y="90" width="100" height="26" rx="6"/>
    <rect x="546" y="90" width="100" height="26" rx="6"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="200" y="152" width="480" height="70" rx="6" stroke-dasharray="5 4"/>
  </g>
  <g class="dg-title" font-size="14" font-weight="600" fill="#1F2A22">
    <text x="80" y="131" text-anchor="middle">A post</text>
    <text x="216" y="44">Knowledge</text>
    <text x="216" y="177">Conversation</text>
  </g>
  <g class="dg-sub" font-size="11.5" fill="#52594C">
    <text x="216" y="59">confirmed answers · guides · official notices · event records</text>
    <text x="216" y="74">kept as the network's memory, with its state shown</text>
    <text x="266" y="108" text-anchor="middle">current</text>
    <text x="376" y="108" text-anchor="middle">updated</text>
    <text x="486" y="108" text-anchor="middle">superseded</text>
    <text x="596" y="108" text-anchor="middle">archived</text>
    <text x="216" y="192">discussion · unconfirmed answers · comments</text>
    <text x="216" y="207">archived after a set period, then deleted</text>
  </g>
</svg>
