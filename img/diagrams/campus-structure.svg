<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 545" role="img" aria-labelledby="dg-campus-structure-title dg-campus-structure-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-campus-structure-title">How the parts of CAMPUS relate</title>
  <desc id="dg-campus-structure-desc">CAMPUS, a student-first digital layer over the physical university, complements VSU's systems and DIGITS; how CAMPUS relates to DIGITS is VSU's to decide. CAMPUS proposes one product, the social/academic network, whose first place is the first build. The network has later modules, the marketplace, Housing, and Hop-It's delivery, each waiting for its own evidence, and the campus intranet as its long-term infrastructure, a direction only. CAMPUS also includes the digital twin, research only, whose first step, places and an office guide, is proposed, and later directions, which are not commitments.</desc>
