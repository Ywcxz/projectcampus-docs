<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" role="img" aria-labelledby="dg-twin-path-title dg-twin-path-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-twin-path-title">The twin's path, step by step</title>
  <desc id="dg-twin-path-desc">Five steps in order. Steps 1 and 2, places and the way there, then where to go for what, are the first step, built as the network's first places. Branching from them is what is studied here: research only, and a labeled mock-up first. Then step 3, VSU's spatial data, if VSU shares it; step 4, status offices may keep, linked where VSU permits; and step 5, sensors, deferred. After the steps come three-dimensional models, simulation, and live dashboards, once an office would use them.</desc>
  <defs>
    <marker id="dg-twin-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrow" d="M0,0 L10,5 L0,10 z" fill="#8B9083"/>
    </marker>
  </defs>
  <g class="dg-node dg-tint" fill="#E2E2D3" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="20" width="360" height="150" rx="6"/>
  </g>
  <g class="dg-edge" fill="none" stroke="#8B9083" stroke-width="1.4">
    <path d="M200,94 V112" marker-end="url(#dg-twin-path-arrow)"/>
    <path d="M364,134 H438" marker-end="url(#dg-twin-path-arrow)"/>
    <path d="M200,154 V198" marker-end="url(#dg-twin-path-arrow)"/>
    <path d="M200,250 V268" marker-end="url(#dg-twin-path-arrow)"/>
    <path d="M200,320 V338" marker-end="url(#dg-twin-path-arrow)"/>
    <path d="M200,390 V418" marker-end="url(#dg-twin-path-arrow)"/>
  </g>
  <g class="dg-node dg-key" fill="#D5E6D3" stroke="#17643A" stroke-width="1.4">
    <rect x="36" y="54" width="328" height="40" rx="6"/>
    <rect x="36" y="114" width="328" height="40" rx="6"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="36" y="200" width="328" height="50" rx="6"/>
    <rect x="36" y="270" width="328" height="50" rx="6"/>
    <rect x="36" y="340" width="328" height="50" rx="6" stroke-dasharray="5 4"/>
    <rect x="36" y="420" width="328" height="70" rx="6" stroke-dasharray="5 4"/>
    <rect x="440" y="102" width="240" height="64" rx="6" stroke-dasharray="5 4"/>
  </g>
  <g class="dg-label" font-size="11.5" font-style="italic" fill="#52594C">
    <text x="200" y="42" text-anchor="middle">the first step, built as the network's first places</text>
  </g>
  <g class="dg-title" font-size="14" font-weight="600" fill="#1F2A22">
    <text x="200" y="79" text-anchor="middle">1. Places and the way there</text>
    <text x="200" y="139" text-anchor="middle">2. Where to go for what</text>
    <text x="560" y="127" text-anchor="middle">What is studied here</text>
    <text x="200" y="221" text-anchor="middle">3. VSU's spatial data</text>
    <text x="200" y="291" text-anchor="middle">4. Status offices may keep</text>
    <text x="200" y="361" text-anchor="middle">5. Sensors</text>
    <text x="200" y="444" text-anchor="middle">Then three-dimensional models,</text>
    <text x="200" y="462" text-anchor="middle">simulation, and live dashboards</text>
  </g>
  <g class="dg-sub" font-size="11.5" fill="#52594C">
    <text x="560" y="143" text-anchor="middle">research only;</text>
    <text x="560" y="157" text-anchor="middle">a labeled mock-up first</text>
    <text x="200" y="238" text-anchor="middle">if VSU shares it</text>
    <text x="200" y="308" text-anchor="middle">linked where VSU permits</text>
    <text x="200" y="378" text-anchor="middle">deferred</text>
    <text x="200" y="479" text-anchor="middle">once an office would use them</text>
  </g>
</svg>
