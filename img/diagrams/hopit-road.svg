<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 196" role="img" aria-labelledby="dg-hopit-road-title dg-hopit-road-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-hopit-road-title">Road to a decision</title>
  <desc id="dg-hopit-road-desc">Seven steps in order: the PRD, runnable Alpha slices, a synthetic rehearsal, an individual baseline, a controlled bundled cohort, an evidence report, and then a decision to iterate, expand, or stop.</desc>
  <defs>
    <marker id="dg-hopit-road-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrow" d="M0,0 L10,5 L0,10 z" fill="#8B9083"/>
    </marker>
  </defs>
  <g class="dg-edge" fill="none" stroke="#8B9083" stroke-width="1.4">
    <path d="M170,49 H188" marker-end="url(#dg-hopit-road-arrow)"/>
    <path d="M340,49 H358" marker-end="url(#dg-hopit-road-arrow)"/>
    <path d="M510,49 H528" marker-end="url(#dg-hopit-road-arrow)"/>
    <path d="M605,78 V98 H95 V116" marker-end="url(#dg-hopit-road-arrow)"/>
    <path d="M170,147 H188" marker-end="url(#dg-hopit-road-arrow)"/>
    <path d="M340,147 H358" marker-end="url(#dg-hopit-road-arrow)"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="20" width="150" height="58" rx="6"/>
    <rect x="190" y="20" width="150" height="58" rx="6"/>
    <rect x="360" y="20" width="150" height="58" rx="6"/>
    <rect x="530" y="20" width="150" height="58" rx="6"/>
    <rect x="20" y="118" width="150" height="58" rx="6"/>
    <rect x="190" y="118" width="150" height="58" rx="6"/>
  </g>
  <g class="dg-node dg-key" fill="#D5E6D3" stroke="#17643A" stroke-width="1.4">
    <rect x="360" y="118" width="150" height="58" rx="6"/>
  </g>
  <g class="dg-title" font-size="14" font-weight="600" fill="#1F2A22">
    <text x="95" y="54" text-anchor="middle">PRD</text>
    <text x="265" y="45" text-anchor="middle">runnable Alpha</text>
    <text x="265" y="63" text-anchor="middle">slices</text>
    <text x="435" y="45" text-anchor="middle">synthetic</text>
    <text x="435" y="63" text-anchor="middle">rehearsal</text>
    <text x="605" y="45" text-anchor="middle">individual</text>
    <text x="605" y="63" text-anchor="middle">baseline</text>
    <text x="95" y="143" text-anchor="middle">controlled</text>
    <text x="95" y="161" text-anchor="middle">bundled cohort</text>
    <text x="265" y="152" text-anchor="middle">evidence report</text>
    <text x="435" y="143" text-anchor="middle">iterate, expand,</text>
    <text x="435" y="161" text-anchor="middle">or stop</text>
  </g>
</svg>
