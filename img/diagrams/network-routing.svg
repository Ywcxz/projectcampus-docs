<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 431" role="img" aria-labelledby="dg-network-routing-title dg-network-routing-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-network-routing-title">Asking: routing questions to people who know</title>
  <desc id="dg-network-routing-desc">A member writes a question. Answers that already exist are shown first; if one is found, that is done. Otherwise the asker picks a topic and whom to ask: students, faculty, an office, or, later, alumni. The question reaches a few members who chose that topic, and the place's questions board. If it is unanswered after a set time, or only an office can settle it, it moves to the office responsible. The best answer is confirmed, dated, and kept.</desc>
  <defs>
    <marker id="dg-network-routing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrow" d="M0,0 L10,5 L0,10 z" fill="#8B9083"/>
    </marker>
  </defs>
  <g class="dg-edge" fill="none" stroke="#8B9083" stroke-width="1.4">
    <path d="M240,60 V78" marker-end="url(#dg-network-routing-arrow)"/>
    <path d="M460,100 H498" marker-end="url(#dg-network-routing-arrow)"/>
    <path d="M240,120 V138" marker-end="url(#dg-network-routing-arrow)"/>
    <path d="M240,195 V213" marker-end="url(#dg-network-routing-arrow)"/>
    <path d="M240,273 V291" marker-end="url(#dg-network-routing-arrow)"/>
    <path d="M460,322 H498" marker-end="url(#dg-network-routing-arrow)"/>
    <path d="M240,351 V369" marker-end="url(#dg-network-routing-arrow)"/>
    <path d="M590,351 V391 H462" marker-end="url(#dg-network-routing-arrow)"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="20" width="440" height="40" rx="6"/>
    <rect x="20" y="80" width="440" height="40" rx="6"/>
  </g>
  <g class="dg-node dg-key" fill="#D5E6D3" stroke="#17643A" stroke-width="1.4">
    <rect x="500" y="80" width="180" height="40" rx="6"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="140" width="440" height="55" rx="6"/>
    <rect x="20" y="215" width="440" height="58" rx="6"/>
  </g>
  <g class="dg-node dg-tint" fill="#E2E2D3" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="293" width="440" height="58" rx="6"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="500" y="293" width="180" height="58" rx="6"/>
  </g>
  <g class="dg-node dg-key" fill="#D5E6D3" stroke="#17643A" stroke-width="1.4">
    <rect x="20" y="371" width="440" height="40" rx="6"/>
  </g>
  <g class="dg-label" font-size="11.5" font-style="italic" fill="#52594C">
    <text x="468" y="94">found</text>
    <text x="468" y="316">yes</text>
    <text x="248" y="365">no</text>
  </g>
  <g class="dg-title" font-size="14" font-weight="600" fill="#1F2A22">
    <text x="240" y="45" text-anchor="middle">A member writes a question</text>
    <text x="240" y="105" text-anchor="middle">Answers that already exist are shown first</text>
    <text x="590" y="105" text-anchor="middle">Found: done</text>
    <text x="240" y="165" text-anchor="middle">The asker picks a topic and whom to ask</text>
    <text x="240" y="240" text-anchor="middle">It reaches a few members who chose that topic,</text>
    <text x="240" y="258" text-anchor="middle">and the place's questions board</text>
    <text x="240" y="318" text-anchor="middle">Unanswered after a set time,</text>
    <text x="240" y="336" text-anchor="middle">or only an office can settle it?</text>
    <text x="590" y="318" text-anchor="middle">It moves to the</text>
    <text x="590" y="336" text-anchor="middle">office responsible</text>
    <text x="240" y="396" text-anchor="middle">The best answer is confirmed, dated, and kept</text>
  </g>
  <g class="dg-sub" font-size="11.5" fill="#52594C">
    <text x="240" y="180" text-anchor="middle">students · faculty · an office · alumni, later</text>
  </g>
</svg>
