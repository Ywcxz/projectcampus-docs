<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="dg-ring-bench-title dg-ring-bench-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-ring-bench-title">The bench</title>
  <desc id="dg-ring-bench-desc">Hundreds of scripted phones and a few real phones connect to one Wi-Fi access point. It leads to the bench server, which runs campus services in containers (sign-in, names, notices, files, discussion, and an outbox receiver) with an ordinary web cache in front of them. Below it is an uplink that can be switched on, slowed, or cut, and beyond that an &quot;outside&quot; server standing in for services hosted off campus.</desc>
  <defs>
    <marker id="dg-ring-bench-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrow" d="M0,0 L10,5 L0,10 z" fill="#8B9083"/>
    </marker>
  </defs>
  <g class="dg-edge" fill="none" stroke="#8B9083" stroke-width="1.4">
    <path d="M165,60 V80 H535 V60"/>
    <path d="M350,80 V100"/>
    <path d="M350,140 V170"/>
    <path d="M350,255 V285"/>
    <path d="M350,325 V355"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="40" y="20" width="250" height="40" rx="6"/>
    <rect x="410" y="20" width="250" height="40" rx="6"/>
    <rect x="225" y="100" width="250" height="40" rx="6"/>
  </g>
  <g class="dg-node dg-key" fill="#D5E6D3" stroke="#17643A" stroke-width="1.4">
    <rect x="90" y="170" width="520" height="85" rx="6"/>
  </g>
  <g class="dg-node dg-tint" fill="#E2E2D3" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="150" y="285" width="400" height="40" rx="6" stroke-dasharray="5 4"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="150" y="355" width="400" height="55" rx="6"/>
  </g>
  <g class="dg-title" font-size="14" font-weight="600" fill="#1F2A22">
    <text x="165" y="45" text-anchor="middle">Scripted phones (hundreds)</text>
    <text x="535" y="45" text-anchor="middle">Real phones (a few)</text>
    <text x="350" y="125" text-anchor="middle">Wi-Fi access point</text>
    <text x="350" y="195" text-anchor="middle">Bench server</text>
    <text x="350" y="310" text-anchor="middle">Uplink that can be switched on, slowed, or cut</text>
    <text x="350" y="380" text-anchor="middle">An &quot;outside&quot; server</text>
  </g>
  <g class="dg-sub" font-size="11.5" fill="#52594C">
    <text x="350" y="210" text-anchor="middle">campus services in containers: sign-in · names</text>
    <text x="350" y="225" text-anchor="middle">notices · files · discussion · an outbox receiver</text>
    <text x="350" y="240" text-anchor="middle">an ordinary web cache in front of them</text>
    <text x="350" y="395" text-anchor="middle">standing in for services hosted off campus</text>
  </g>
</svg>
