<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 224" role="img" aria-labelledby="dg-hopit-hypothesis-title dg-hopit-hypothesis-desc" font-family="IBM Plex Sans, sans-serif">
  <title id="dg-hopit-hypothesis-title">The hypothesis</title>
  <desc id="dg-hopit-hypothesis-desc">A chain of six steps: scheduled flexibility leads to compatible demand, then a human-confirmed bundle, then a shared delivery run, then lower effort per completed order, with service outcomes checked against guardrails.</desc>
  <defs>
    <marker id="dg-hopit-hypothesis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrow" d="M0,0 L10,5 L0,10 z" fill="#8B9083"/>
    </marker>
  </defs>
  <g class="dg-edge" fill="none" stroke="#8B9083" stroke-width="1.4">
    <path d="M220,56 H248" marker-end="url(#dg-hopit-hypothesis-arrow)"/>
    <path d="M450,56 H478" marker-end="url(#dg-hopit-hypothesis-arrow)"/>
    <path d="M580,92 V112 H120 V130" marker-end="url(#dg-hopit-hypothesis-arrow)"/>
    <path d="M220,168 H248" marker-end="url(#dg-hopit-hypothesis-arrow)"/>
    <path d="M450,168 H478" marker-end="url(#dg-hopit-hypothesis-arrow)"/>
  </g>
  <g class="dg-node" fill="#EAEAE0" stroke="#C3BEA9" stroke-width="1.2">
    <rect x="20" y="20" width="200" height="72" rx="6"/>
    <rect x="250" y="20" width="200" height="72" rx="6"/>
    <rect x="480" y="20" width="200" height="72" rx="6"/>
    <rect x="20" y="132" width="200" height="72" rx="6"/>
    <rect x="250" y="132" width="200" height="72" rx="6"/>
    <rect x="480" y="132" width="200" height="72" rx="6"/>
  </g>
  <g class="dg-title" font-size="14" font-weight="600" fill="#1F2A22">
    <text x="120" y="61" text-anchor="middle">scheduled flexibility</text>
    <text x="350" y="61" text-anchor="middle">compatible demand</text>
    <text x="580" y="52" text-anchor="middle">human-confirmed</text>
    <text x="580" y="70" text-anchor="middle">bundle</text>
    <text x="120" y="173" text-anchor="middle">shared delivery run</text>
    <text x="350" y="164" text-anchor="middle">lower effort per</text>
    <text x="350" y="182" text-anchor="middle">completed order</text>
    <text x="580" y="155" text-anchor="middle">service outcomes</text>
    <text x="580" y="173" text-anchor="middle">checked against</text>
    <text x="580" y="191" text-anchor="middle">guardrails</text>
  </g>
</svg>
